<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>작성자 복사 버튼 설치</title>
<style>
  body{font:16px/1.6 'Malgun Gothic',sans-serif;max-width:640px;margin:40px auto;padding:0 16px;color:#222;background:#fff}
  .bm{display:inline-block;padding:14px 26px;margin:16px 0;border-radius:12px;background:#03c75a;color:#fff;
    font-size:22px;font-weight:bold;text-decoration:none;cursor:grab;box-shadow:0 4px 14px rgba(0,0,0,.2)}
  ol li{margin:6px 0} kbd{background:#eee;border-radius:4px;padding:1px 6px;border:1px solid #ccc}
  textarea{width:100%;height:90px;font-size:12px}
</style></head><body>
<h1>📋 작성자 복사 버튼 설치</h1>
<p>아래 초록 버튼을 <b>마우스로 잡고 크롬 북마크바(주소창 바로 아래)로 끌어다 놓으세요.</b></p>
<a class="bm" href="javascript:(() => { const SELECTORS = [ '.ArticleTopBox .WriterInfo .nickname', '.ArticleTopBox .nick_box .nickname', '.ArticleTopBox .nickname', '.ArticleTopBox [class*=&quot;nick&quot;]', '.article_header .nickname', '.article_writer .user', '.WriterInfo [class*=&quot;nick&quot;]', ]; const docs = []; const collect = (w) => { try { docs.push(w.document); } catch (e) { return; } for (const f of w.document.querySelectorAll('iframe')) { try { if (f.contentWindow) collect(f.contentWindow); } catch (e) {} } }; collect(window); let nick = '', doc = null; for (const d of docs) { for (const s of SELECTORS) { const el = d.querySelector(s); const t = el &amp;&amp; el.textContent.replace(/\s+/g, ' ').trim(); if (t) { nick = t; doc = d; break; } } if (nick) break; } const toast = (msg, ok) => { const old = document.getElementById('onehand-toast'); if (old) old.remove(); const el = document.createElement('div'); el.id = 'onehand-toast'; el.textContent = msg; el.style.cssText = 'position:fixed;top:20px;left:0;right:0;margin:0 auto;width:fit-content;' + 'z-index:2147483647;padding:14px 22px;border-radius:12px;font:bold 20px Malgun Gothic,sans-serif;color:#fff;' + 'box-shadow:0 6px 24px rgba(0,0,0,.3);background:' + (ok ? '#03c75a' : '#e03131'); document.body.appendChild(el); setTimeout(() => el.remove(), ok ? 1500 : 3000); }; if (!nick) { toast('작성자를 못 찾았어요. 카페 글을 연 상태에서 눌러 주세요.', false); return; } const legacyCopy = (d) => { const ta = d.createElement('textarea'); ta.value = nick; ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0'; d.body.appendChild(ta); ta.select(); let ok = false; try { ok = d.execCommand('copy'); } catch (e) {} ta.remove(); return ok; }; if (legacyCopy(doc) || legacyCopy(document)) { toast('📋 ' + nick + ' 복사됨', true); } else { navigator.clipboard.writeText(nick) .then(() => toast('📋 ' + nick + ' 복사됨', true)) .catch(() => prompt('자동 복사가 막혔어요. Ctrl+C로 복사해 주세요:', nick)); } })();" onclick="alert('여기서 누르는 게 아니라, 북마크바로 끌어다 놓아 주세요!');return false;">작성자 복사</a>
<ol>
  <li>북마크바가 안 보이면 <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>B</kbd></li>
  <li>네이버 카페 글을 연 상태에서 북마크바의 <b>작성자 복사</b>를 클릭</li>
  <li>화면 위에 초록색 "📋 닉네임 복사됨"이 뜨면 룰렛에 붙여넣기</li>
</ol>
<details><summary>끌어다 놓기가 안 될 때 (직접 추가)</summary>
<p>북마크바 빈 곳 우클릭 → <b>페이지 추가</b> → 이름: <code>작성자 복사</code>, URL 칸에 아래 내용을 통째로 붙여넣기</p>
<textarea readonly onclick="this.select()">javascript:(() => { const SELECTORS = [ '.ArticleTopBox .WriterInfo .nickname', '.ArticleTopBox .nick_box .nickname', '.ArticleTopBox .nickname', '.ArticleTopBox [class*="nick"]', '.article_header .nickname', '.article_writer .user', '.WriterInfo [class*="nick"]', ]; const docs = []; const collect = (w) => { try { docs.push(w.document); } catch (e) { return; } for (const f of w.document.querySelectorAll('iframe')) { try { if (f.contentWindow) collect(f.contentWindow); } catch (e) {} } }; collect(window); let nick = '', doc = null; for (const d of docs) { for (const s of SELECTORS) { const el = d.querySelector(s); const t = el &amp;&amp; el.textContent.replace(/\s+/g, ' ').trim(); if (t) { nick = t; doc = d; break; } } if (nick) break; } const toast = (msg, ok) => { const old = document.getElementById('onehand-toast'); if (old) old.remove(); const el = document.createElement('div'); el.id = 'onehand-toast'; el.textContent = msg; el.style.cssText = 'position:fixed;top:20px;left:0;right:0;margin:0 auto;width:fit-content;' + 'z-index:2147483647;padding:14px 22px;border-radius:12px;font:bold 20px Malgun Gothic,sans-serif;color:#fff;' + 'box-shadow:0 6px 24px rgba(0,0,0,.3);background:' + (ok ? '#03c75a' : '#e03131'); document.body.appendChild(el); setTimeout(() => el.remove(), ok ? 1500 : 3000); }; if (!nick) { toast('작성자를 못 찾았어요. 카페 글을 연 상태에서 눌러 주세요.', false); return; } const legacyCopy = (d) => { const ta = d.createElement('textarea'); ta.value = nick; ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0'; d.body.appendChild(ta); ta.select(); let ok = false; try { ok = d.execCommand('copy'); } catch (e) {} ta.remove(); return ok; }; if (legacyCopy(doc) || legacyCopy(document)) { toast('📋 ' + nick + ' 복사됨', true); } else { navigator.clipboard.writeText(nick) .then(() => toast('📋 ' + nick + ' 복사됨', true)) .catch(() => prompt('자동 복사가 막혔어요. Ctrl+C로 복사해 주세요:', nick)); } })();</textarea>
</details>
</body></html>
